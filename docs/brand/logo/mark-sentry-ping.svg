<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="100" height="116" role="img" aria-label="LazySentry logo mark">
  <defs>
    <linearGradient id="g" x1="10" y1="4" x2="90" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M50 8 L18 22 V50 C18 76 32 94 50 106 C68 94 82 76 82 50 V22 L50 8 Z"/>
    </clipPath>
  </defs>

  <path d="M50 8 L18 22 V50 C18 76 32 94 50 106 C68 94 82 76 82 50 V22 L50 8 Z" fill="url(#g)"/>

  <g clip-path="url(#shieldClip)">
    <!-- quiet ping, top-right: still listening even with eyes half-shut -->
    <circle cx="74" cy="26" r="20" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.35"/>
    <circle cx="74" cy="26" r="14" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.6"/>
    <circle cx="74" cy="26" r="8" fill="none" stroke="#ffffff" stroke-width="2.8" opacity="0.95"/>
    <circle cx="74" cy="26" r="2.5" fill="#ffffff"/>

    <!-- half-lidded eye: lazy on the outside, still alert -->
    <path d="M26 58 Q50 38 74 58 Q50 72 26 58 Z" fill="#ffffff"/>
    <circle cx="50" cy="58" r="6" fill="#4c1d95"/>
    <circle cx="52.5" cy="55.5" r="1.5" fill="#ffffff"/>
  </g>
</svg>
