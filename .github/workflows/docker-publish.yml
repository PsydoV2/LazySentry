name: Publish Docker image

# Builds the image (docs/CONCEPT.md 0.2, 3.2) and pushes it to GHCR so
# `docker-compose.yml` can be used standalone — no repo checkout needed
# (README.md "Getting started (Docker)"). The `test` job runs on every push
# to main as plain CI; the `publish` job — the actual multi-arch Docker
# build — only runs on a `vX.Y.Z` release tag (release.sh/release.ps1),
# not on every commit to main.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  publish:
    needs: test
    # Only a release tag builds and pushes the image — a plain push to main
    # just ran the test job above and stops there.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Lower-cased automatically — the repo itself is "PsydoV2/LazySentry",
          # but OCI image references must be lowercase.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so a running instance can compare itself
          # against GitHub's tags (in-app update notice).
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
